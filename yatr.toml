# yatr - https://github.com/cargopete/yatr
#
# CI calls these tasks by name, so `yatr ci` locally is the same gate.
# test-it, serve and the demos need AGE and RabbitMQ: `yatr services-up` first.

[settings]
cache = true

[tasks.deps]
desc = "Download Hex and git packages"
run = ["gleam deps download"]
sources = ["gleam.toml", "manifest.toml"]
outputs = ["build/packages/**"]

[tasks.fmt]
desc = "Format src and test"
run = ["gleam format src test"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if src or test is unformatted (CI)"
run = ["gleam format --check src test"]
sources = ["src/**/*.gleam", "test/**/*.gleam"]

[tasks.build]
desc = "Compile for the BEAM (CI)"
depends = ["deps"]
run = ["gleam build"]
sources = ["src/**", "priv/**", "gleam.toml", "manifest.toml"]
outputs = ["build/dev/erlang/**"]

[tasks.test]
desc = "The pure tests (integration tests skip without TERN_IT)"
depends = ["deps"]
run = ["gleam test"]
sources = ["src/**", "test/**", "priv/**", "gleam.toml", "manifest.toml"]

# Not cached: the outcome depends on the live AGE and RabbitMQ, not only on the tree.
[tasks.test-it]
desc = "All tests, including AGE + RabbitMQ integration (CI)"
depends = ["deps"]
env = { TERN_IT = "1" }
run = ["gleam test"]
no_cache = true

[tasks.docs]
desc = "Build the HexDocs site into build/dev/docs"
depends = ["deps"]
run = ["gleam docs build"]
sources = ["src/**", "gleam.toml", "manifest.toml", "README.md", "CHANGELOG.md"]
outputs = ["build/dev/docs/tern/**"]

[tasks.services-up]
desc = "Start Apache AGE (:5455) and RabbitMQ"
run = ["docker compose up -d"]
no_cache = true

[tasks.services-down]
desc = "Stop the local services"
run = ["docker compose down"]
no_cache = true

[tasks.showcase]
desc = "Seed an evolving demo pipeline into AGE"
depends = ["deps"]
run = ["gleam run -m showcase"]
no_cache = true

[tasks.serve]
desc = "Lineage explorer on http://localhost:8080/"
depends = ["deps"]
foreground = true
run = ["gleam run -m serve"]

[tasks.consume-demo]
desc = "Consume lineage events from RabbitMQ"
depends = ["deps"]
foreground = true
run = ["gleam run -m consume_demo"]

[tasks.ci]
desc = "What CI runs: fmt-check, build, test-it"
depends = ["fmt-check", "build", "test-it"]
run = []
